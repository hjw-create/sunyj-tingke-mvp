    <h1 class="title">我们不发预警：核对单能帮什么、不能帮什么</h1>
    <div class="warn"><strong>红线写在最前：</strong>不代替学校应急通知、不对外发布预警、不卖气象设备。</div>
    <p class="p">有人原话：「别替学校发停课令。」也有人说：「一张表记下预报和谁同意继续可以，别一上来卖测风仪。」</p>
    <p class="p"><strong>能帮你的</strong>：提醒对照公开预报、记当场天况、写清同意人；一页纸、人话、课前就能勾。</p>
    <p class="p"><strong>不能帮你的</strong>：不编预警级别、不代替学校通知、不保证安全、不绑设备链接。</p>
    <p class="p">红线清楚，你再决定要不要试填。</p>
